<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-dark text-light">
    <div
      class="container d-flex flex-column min-vh-100 justify-content-center align-items-center"
    >
      <div class="d-flex flex-column">
        <h1 class="text-center text-uppercase">
          Password Generator Ryan punya
        </h1>
        <div class="d-flex gap-2 flex-column">
          <label for="passwordLength" class="text-uppercase"
            >Panjang Password :</label
          >
          <input type="number" id="passwordLength" class="form-control-lg" />
          <label for="password" class="text-uppercase">Password</label>
          <input
            type="text"
            id="password"
            class="form-control-lg text-light bg-black"
            disabled
          />
          <button class="btn btn-secondary mt-2 btn-lg" onclick="getPassword()">
            Generate Password
          </button>
          <a
            class="btn btn-primary mt-2 btn-lg"
            onclick="savePassword()"
            id="saveButton"
          >
            Save Password
          </a>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
